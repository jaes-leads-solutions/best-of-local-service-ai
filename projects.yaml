configuration:
  markdown_header_file: config/header.md
  markdown_footer_file: config/footer.md
  min_stars: 100
  min_projectrank: 5
  allowed_licenses:
  - all
  project_inactive_months: 6
  project_dead_months: 12
  max_description_length: 80
  generate_install_hints: true
  hide_empty_categories: false
categories:
- category: voice-agents
  title: AI Receptionists & Voice Agents
  subtitle: Answer calls, qualify leads, and book jobs 24/7 with voice AI.
- category: chatbots
  title: Website Chatbots & Customer Messaging
  subtitle: Chat widgets, shared inboxes, and lead-capture bots for your website, SMS, and social.
- category: automation
  title: AI Workflow Automation
  subtitle: 'Glue tools together: missed-call text-back, review requests, lead routing.'
- category: scheduling-crm
  title: Booking, Scheduling & CRM
  subtitle: Online booking and customer/lead management.
- category: invoicing-fsm
  title: Invoicing, Accounting & Field Service
  subtitle: Quotes, invoices, payments, and job dispatch.
- category: local-seo
  title: Local SEO, Site Audits & Reputation
  subtitle: Rank tracking, technical audits, and Google Maps/review research.
- category: analytics-calls
  title: Web Analytics & Call Transcription
  subtitle: Measure traffic and conversions, and turn recorded calls into text and insights.
- category: marketing
  title: Email, Social & Content Marketing
  subtitle: Newsletters, social scheduling, and marketing automation.
labels:
- label: self-hosted
  name: self-hosted
  description: Can be self-hosted
- label: source-available
  name: 🔒 source-available
  description: Code is public but the license is not OSI-approved open source
- label: telephony
  name: 📞 phone
  description: Works with phone calls or SMS (e.g., via Twilio)
- label: no-code
  name: no-code
  description: Usable without programming
